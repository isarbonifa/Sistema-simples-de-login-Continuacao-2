<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Cadastro</title></head>
<body>
    <h2>Cadastro Simples</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>{% for cat, msg in messages %}<li>{{ msg }}</li>{% endfor %}</ul>
      {% endif %}
    {% endwith %}
    <form method="POST">
        Usuário: <input type="text" name="username" required><br><br>
        Senha: <input type="password" name="password" required><br><br>
        <button type="submit">Cadastrar</button>
    </form>
    <p>Já tem conta? <a href="{{ url_for('auth.login') }}">Fazer login</a></p>
</body>
</html>
